<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello, Abogada 🌷</title>
<style>
  :root{
    --sky-top:#fff6d8;
    --sky-bottom:#ffe9a8;
    --text-dark:#4a3312;
    --tulip-light:#fff6a8;
    --tulip:#ffd400;
    --tulip-mid:#f6b800;
    --tulip-dark:#c98700;
    --leaf:#2f6d1e;
    --leaf-dark:#1f4d12;
    --leaf-light:#4f9a2e;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow:hidden;
    background:#fff6d8;
  }
  .screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .8s ease, visibility .8s ease;
  }
  /* ---------- PANTALLA 1 ---------- */
  #screen-hello{
    background:radial-gradient(circle at 50% 30%, #fffdf0 0%, var(--sky-top) 45%, #ffe6a0 100%);
    flex-direction:column;
    text-align:center;
    padding:24px;
    z-index:2;
  }
  #screen-hello.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .hello-title{
    font-size:clamp(2.5rem, 10vw, 6rem);
    font-weight:800;
    color:var(--text-dark);
    text-shadow:2px 2px 0 #fff3c4, 4px 4px 12px rgba(0,0,0,0.08);
    margin:0 0 8px 0;
    letter-spacing:1px;
    animation:pop-in 1s ease;
  }
  .hello-sub{
    font-size:clamp(1rem,3vw,1.3rem);
    color:#8a6a2f;
    margin:0 0 40px 0;
    font-style:italic;
    animation:fade-in 1.6s ease;
  }
  @keyframes pop-in{
    0%{ transform:scale(0.6); opacity:0; }
    60%{ transform:scale(1.05); opacity:1; }
    100%{ transform:scale(1); }
  }
  @keyframes fade-in{
    0%{ opacity:0; }
    100%{ opacity:1; }
  }
  .enter-btn{
    font-size:1.1rem;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg, #f7c948, #f2a20c);
    border:none;
    padding:16px 40px;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(242,162,12,0.4);
    transition:transform .2s ease, box-shadow .2s ease;
    animation:fade-in 2.2s ease;
  }
  .enter-btn:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 12px 26px rgba(242,162,12,0.5);
  }
  .enter-btn:active{
    transform:translateY(0) scale(0.98);
  }

  /* ---------- PANTALLA 2: JARDIN DE TULIPANES ---------- */
  #screen-garden{
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 30%),
      radial-gradient(circle at 75% 10%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 25%),
      linear-gradient(to bottom, #b7d16a 0%, #6fae2c 18%, #3f8a17 40%, #1f5c0d 70%, #113d08 100%);
    opacity:0;
    visibility:hidden;
    z-index:1;
    overflow:hidden;
  }
  #screen-garden.visible{
    opacity:1;
    visibility:visible;
  }

  .garden-wrap{
    position:relative;
    width:100%;
    height:100%;
  }

  .message{
    position:absolute;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    max-width:340px;
    width:86%;
    padding:18px 24px;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(3px);
    border-radius:20px;
    color:#2f4a12;
    font-size:clamp(0.95rem,2.4vw,1.15rem);
    line-height:1.5;
    font-weight:700;
    text-align:center;
    text-shadow:0 1px 0 rgba(255,255,255,0.4);
    box-shadow:0 8px 24px rgba(20,40,10,0.2);
    opacity:0;
    animation:message-in 1.4s ease forwards;
    animation-delay:1.4s;
    z-index:8;
  }
  @keyframes message-in{
    0%{ opacity:0; transform:translateX(-50%) translateY(-16px); }
    100%{ opacity:1; transform:translateX(-50%) translateY(0); }
  }

  .tulip-field{
    position:absolute;
    inset:0;
    z-index:3;
  }

  .tulip-slot{
    position:absolute;
    transform-origin:bottom center;
  }

  .tulip{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform-origin:bottom center;
    animation:sprout 0.9s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes sprout{
    0%{ transform:scaleY(0) translateY(30px); opacity:0; }
    55%{ opacity:1; }
    100%{ transform:scaleY(1) translateY(0); opacity:1; }
  }

  .t-leaf{
    position:absolute;
    bottom:0;
    width:14px;
    height:60%;
    background:linear-gradient(to top, var(--leaf-dark), var(--leaf) 60%, var(--leaf-light));
    border-radius:0 100% 0 100% / 0 100% 0 100%;
  }
  .t-leaf.l{ left:-8px; transform:rotate(14deg); }
  .t-leaf.r{ right:-8px; transform:rotate(-14deg) scaleX(-1); }

  .t-stem{
    width:5px;
    background:linear-gradient(to top, var(--leaf-dark), var(--leaf-light));
    border-radius:2px;
    position:relative;
  }

  .t-cup{
    position:relative;
    width:38px;
    height:46px;
    margin-bottom:-4px;
    animation:sway 4s ease-in-out infinite;
    transform-origin:bottom center;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-3deg); }
    50%{ transform:rotate(3deg); }
  }
  .t-petal{
    position:absolute;
    bottom:0;
    width:22px;
    height:42px;
    background:linear-gradient(to top, var(--tulip-dark) 0%, var(--tulip-mid) 35%, var(--tulip) 65%, var(--tulip-light) 100%);
    border-radius:50% 50% 45% 45% / 65% 65% 35% 35%;
    box-shadow:inset -3px -2px 5px rgba(160,100,0,0.35);
  }
  .t-petal.center{ left:50%; transform:translateX(-50%); z-index:3; }
  .t-petal.left{ left:2px; transform:rotate(-18deg); z-index:2; }
  .t-petal.right{ right:2px; transform:rotate(18deg); z-index:2; }
  .t-petal.back-l{ left:-2px; transform:rotate(-8deg); z-index:1; height:40px; opacity:0.9; }
  .t-petal.back-r{ right:-2px; transform:rotate(8deg); z-index:1; height:40px; opacity:0.9; }

  @media (max-width:640px){
    .message{ top:4%; padding:14px 18px; }
  }

  /* ---------- BRILLITOS CAYENDO ---------- */
  .sparkle-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    overflow:hidden;
  }
  .sparkle{
    position:absolute;
    top:-12px;
    border-radius:50%;
    background:radial-gradient(circle, #ffffff 0%, #fff6c8 35%, #ffd400 70%, rgba(255,212,0,0) 100%);
    box-shadow:0 0 6px 1px rgba(255, 230, 130, 0.9);
    animation-name:sparkle-fall, sparkle-twinkle;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:1, infinite;
  }
  @keyframes sparkle-fall{
    from{ transform:translateY(0) rotate(0deg); }
    to{ transform:translateY(115vh) rotate(360deg); }
  }
  @keyframes sparkle-twinkle{
    0%,100%{ opacity:0.25; }
    50%{ opacity:1; }
  }
</style>
</head>
<body>

  <!-- CAPA DE BRILLITOS CAYENDO (sobre toda la pagina) -->
  <div class="sparkle-layer" id="sparkleLayer"></div>

  <!-- PANTALLA 1: BIENVENIDA -->
  <div id="screen-hello" class="screen">
    <h1 class="hello-title">Hello, Abogada</h1>
    <p class="hello-sub">tengo algo para ti…</p>
    <button class="enter-btn" onclick="goToGarden()">Entrar 🌷</button>
  </div>

  <!-- PANTALLA 2: JARDÍN -->
  <div id="screen-garden" class="screen">
    <div class="garden-wrap">
      <div class="message">
        Eres una mujer de carácter admirable, con un alma noble y una sensibilidad que ilumina y transforma todo lo que toca.
      </div>
      <div class="tulip-field" id="tulipField"></div>
    </div>
  </div>

<script>
  function spawnSparkle(){
    const layer = document.getElementById('sparkleLayer');
    const s = document.createElement('div');
    s.className = 'sparkle';

    const size = 4 + Math.random()*7;
    const left = Math.random()*100;
    const fallDuration = 4 + Math.random()*4;
    const twinkleDuration = 0.8 + Math.random()*1.2;
    const delay = Math.random()*0.5;

    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = left + '%';
    s.style.animationDuration = fallDuration + 's, ' + twinkleDuration + 's';
    s.style.animationDelay = delay + 's, 0s';

    layer.appendChild(s);
    setTimeout(() => s.remove(), (fallDuration + delay) * 1000 + 100);
  }

  setInterval(spawnSparkle, 220);
  for(let i=0;i<15;i++){ setTimeout(spawnSparkle, i*120); }

  function goToGarden(){
    document.getElementById('screen-hello').classList.add('hidden');
    const garden = document.getElementById('screen-garden');
    garden.classList.add('visible');
    buildTulips();
  }

  function makeTulip(delay){
    const t = document.createElement('div');
    t.className = 'tulip';
    t.style.animationDelay = delay + 's';

    const cup = document.createElement('div');
    cup.className = 't-cup';
    cup.style.animationDelay = (delay + 0.5 + Math.random()*0.8) + 's';

    ['back-l','back-r','left','right','center'].forEach(cls => {
      const p = document.createElement('div');
      p.className = 't-petal ' + cls;
      cup.appendChild(p);
    });

    const stem = document.createElement('div');
    stem.className = 't-stem';
    stem.style.height = (55 + Math.random()*25) + 'px';

    const leafL = document.createElement('div');
    leafL.className = 't-leaf l';
    const leafR = document.createElement('div');
    leafR.className = 't-leaf r';
    stem.appendChild(leafL);
    stem.appendChild(leafR);

    t.appendChild(cup);
    t.appendChild(stem);
    return t;
  }

  // Crea una fila de tulipanes a una profundidad dada (efecto punto de fuga)
  function makeRow(field, opts){
    const { bottom, scale, count, blur, bright, rowDelay, z } = opts;
    const spacing = 100 / count;
    // el "jitter" horizontal es mas chico mientras mas grande la flor (fila cercana), para que no se amontonen
    const jitter = spacing * 0.28 * (1.3 - scale);

    for(let i=0; i<count; i++){
      const left = spacing * i + spacing/2 + (Math.random()*jitter*2 - jitter);

      const slot = document.createElement('div');
      slot.className = 'tulip-slot';
      slot.style.left = left + '%';
      slot.style.bottom = bottom + '%';
      slot.style.transform = 'translateX(-50%) scale(' + scale + ')';
      slot.style.zIndex = z;
      if(blur > 0 || bright < 1){
        slot.style.filter = 'blur(' + blur + 'px) brightness(' + bright + ')';
      }

      // las flores de atras brotan primero; las de adelante van "llegando" despues
      const delay = rowDelay + Math.random()*0.25;
      slot.appendChild(makeTulip(delay));
      field.appendChild(slot);
    }
  }

  function buildTulips(){
    const field = document.getElementById('tulipField');
    if(field.dataset.built) return;
    field.dataset.built = "1";

    const isMobile = window.innerWidth < 640;
    const density = isMobile ? 0.65 : 1;

    // Filas ordenadas de mas lejos (arriba, chicas, difusas) a mas cerca (abajo, grandes, nitidas)
    // El brote va en el mismo orden: primero florece el fondo, luego se van "acercando"
    const rows = [
      { bottom:46, scale:0.32, count:Math.round(15*density), blur:2.2, bright:0.72, rowDelay:0.0,  z:1 },
      { bottom:38, scale:0.42, count:Math.round(13*density), blur:1.6, bright:0.78, rowDelay:0.18, z:2 },
      { bottom:29, scale:0.55, count:Math.round(11*density), blur:1.0, bright:0.85, rowDelay:0.36, z:3 },
      { bottom:20, scale:0.72, count:Math.round(9*density),  blur:0.4, bright:0.92, rowDelay:0.54, z:4 },
      { bottom:11, scale:0.92, count:Math.round(7*density),  blur:0,   bright:0.97, rowDelay:0.72, z:5 },
      { bottom:0,  scale:1.15, count:Math.round(6*density),  blur:0,   bright:1,    rowDelay:0.9,  z:6 },
    ];

    rows.forEach(row => makeRow(field, row));
  }
</script>
</body>
</html>
